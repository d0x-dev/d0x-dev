<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 500" width="330" height="500">
  <style>
    @keyframes swing {
      0% { transform: rotate(3deg); }
      50% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }
    .lanyard {
      transform-origin: 50% -100px;
      animation: swing 3s ease-in-out infinite;
    }
    .text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
  <g class="lanyard">
    <!-- Lanyard string -->
    <path d="M 165 -100 C 130 0 100 50 145 100 C 160 110 170 110 185 100 C 230 50 200 0 165 -100" fill="none" stroke="#333" stroke-width="8" stroke-dasharray="20 5"/>
    <path d="M 165 -100 C 130 0 100 50 145 100 C 160 110 170 110 185 100 C 230 50 200 0 165 -100" fill="none" stroke="#fff" stroke-width="2"/>
    
    <!-- Clip -->
    <rect x="155" y="90" width="20" height="30" rx="5" fill="#aaa"/>
    <circle cx="165" cy="120" r="10" fill="none" stroke="#aaa" stroke-width="4"/>

    <!-- ID Card -->
    <rect x="65" y="130" width="200" height="300" rx="15" fill="#2c2c2c" stroke="#444" stroke-width="2"/>
    
    <!-- Profile Image -->
    <defs>
      <clipPath id="avatarClip">
        <circle cx="165" cy="200" r="45"/>
      </clipPath>
    </defs>
    

    <!-- Name and Role -->
    <text x="165" y="290" class="text" fill="#fff" font-size="22" text-anchor="middle" font-weight="bold">Dark boy</text>
    <text x="165" y="320" class="text" fill="#bbb" font-size="14" text-anchor="middle">Developer @ StormX</text>

    <!-- Barcode -->
    <rect x="90" y="360" width="150" height="40" fill="#fff"/>
    <g fill="#000">
      <rect x="95" y="365" width="5" height="30"/>
      <rect x="105" y="365" width="2" height="30"/>
      <rect x="110" y="365" width="8" height="30"/>
      <rect x="125" y="365" width="3" height="30"/>
      <rect x="132" y="365" width="6" height="30"/>
      <rect x="145" y="365" width="5" height="30"/>
      <rect x="155" y="365" width="10" height="30"/>
      <rect x="170" y="365" width="4" height="30"/>
      <rect x="180" y="365" width="2" height="30"/>
      <rect x="185" y="365" width="7" height="30"/>
      <rect x="195" y="365" width="5" height="30"/>
      <rect x="210" y="365" width="3" height="30"/>
      <rect x="220" y="365" width="8" height="30"/>
      <rect x="230" y="365" width="2" height="30"/>
    </g>

    <text x="165" y="415" class="text" fill="#777" font-size="10" text-anchor="middle">ID: 218248866</text>
  </g>
</svg>

