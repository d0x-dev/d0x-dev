<svg xmlns="http://www.w3.org/2000/svg" width="415" height="430" viewBox="0 0 415 430" role="img" aria-labelledby="title desc">
  <title id="title">Darkboy Gravatar profile card</title>
  <desc id="desc">Darkboy, Nothing To Do at DxV Studios, Srinagar. Real Eyes, Realise, Real Lies.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82766f"/>
      <stop offset="0.5" stop-color="#3b3029"/>
      <stop offset="1" stop-color="#17221f"/>
    </linearGradient>
    <clipPath id="avatarClip"><circle cx="100" cy="112" r="65"/></clipPath>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="1" y="1" width="413" height="426" rx="5" fill="#fff" stroke="#d5d7da"/>
    <path d="M6 1h403a5 5 0 0 1 5 5v88H1V6a5 5 0 0 1 5-5z" fill="url(#header)"/>
    <circle cx="100" cy="112" r="67" fill="#fff"/>
    <image href="data:image/jpeg;base64," x="35" y="47" width="130" height="130" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
    <text x="30" y="217" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#111">Darkboy</text>
    <text x="30" y="246" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#555">Nothing To Do, DxV Studios</text>
    <text x="30" y="274" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#555">Srinagar</text>
    <text x="30" y="311" font-family="Georgia, serif" font-size="15" font-variant="small-caps" font-weight="700" letter-spacing="0.4" fill="#171717">Real Eyes, Realise, Real Lies</text>
    <g fill="#111">
      <circle cx="49" cy="354" r="14"/><circle cx="96" cy="354" r="14"/><circle cx="143" cy="354" r="14"/>
    </g>
    <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      <text x="49" y="358">D</text><text x="96" y="358">GH</text><text x="143" y="358">➤</text>
    </g>
    <text x="30" y="399" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#555">darkboy.pro</text>
    <text x="385" y="399" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#555" text-anchor="end">View profile →</text>
    <path d="M4 425h407" stroke="#111" stroke-width="5"/>
  </g>
</svg>