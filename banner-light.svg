<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfdfd" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
  </defs>
  <style>
    @keyframes floating {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    .text-title {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 48px;
      font-weight: bold;
      fill: url(#textGrad);
      animation: floating 4s ease-in-out infinite;
    }
    .text-subtitle {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 24px;
      fill: #444444;
    }
  </style>
  <rect width="800" height="200" rx="20" fill="url(#bg)"/>
  <text x="50%" y="45%" text-anchor="middle" dominant-baseline="middle" class="text-title">Hello, I'm Developer! 👋</text>
  <text x="50%" y="70%" text-anchor="middle" dominant-baseline="middle" class="text-subtitle">Welcome to my GitHub Profile</text>
</svg>
